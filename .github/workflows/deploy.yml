name: Deploy Bosque to WAMP

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y compilar Angular
        run: |
          cd frontend
          npm install
          npm run build
        shell: pwsh

      - name: Sincronizar frontend (dist) y backend con WAMP
        run: |
          robocopy frontend\dist\frontend\browser C:\wamp64\www\Bosque\FRONTEND\dist\frontend /E /Y
          if %errorlevel% lss 8 exit 0
          
          robocopy backend C:\wamp64\www\Bosque\backend /E /Y
          if %errorlevel% lss 8 exit 0
        shell: cmd
